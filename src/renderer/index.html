<!--
  DOCKET — DIRECTION CONTRACT

  THESIS: A document workshop that keeps a printed record of its own work. It
  refuses the file-manager arrangement every viewer ships — a folder tree beside
  a preview pane — because the way back to a document is when you last had it
  open, not where it sits on disk.

  OWN-WORLD: The tabulating room, through its print artifacts. Continuous
  fanfold listing paper with alternating green bars and punched tractor strips
  down both margins; machine gray-green console steel for chrome; manila
  card-stock tabs carrying a three-letter stock code per format; black impact
  type for data, a grotesk for controls; red, amber and green annunciator lamps
  as the only state colour. No cards, no rounded panels, no gradients.

  STORY: The user sees a ledger of everything they have opened, understands the
  application remembers so they do not have to, and opens a document straight
  from the record — or drops a new file onto the platen.

  FIRST VIEWPORT: The listing owns the full width. A console header bar carries
  the wordmark, open-document tabs and window controls. Beneath it a job-control
  strip holds search, format filters and OPEN. Beneath that the fanfold runs to
  the bottom edge: printed column rules, banded rows, tractor holes at both
  margins. The primary action, OPEN FILE, sits at the right of the job-control
  strip, in annunciator red.

  FORM: The tabulating room. Candidate 7 of the grounded list; staging is the
  listing-as-continuous-print, chosen over the dealt trim-and-launch bench.
  Seed key 09989916.
-->
